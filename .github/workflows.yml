name: YummyApp Mobile Backend CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  mobile-test-job:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Install Dependencies
        run: |
          pip install uv
          uv sync

      - name: 4. Execute Test Suite
        run: |
          uv run pytest

      - name: 5. Static Code Analysis (Linter)
        run: |
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 6. Execute Tests & Quality Gate
        run: |
          uv run coverage run -m unittest discover -s . -p "test_*.py"
          uv run coverage report -m
          uv run coverage html -d coverage_html
          uv run coverage report --fail-under=80
