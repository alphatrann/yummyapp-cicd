name: YummyApp CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: 3. Install Dependencies
        run: uv sync --locked

      - name: 4. Static Code Analysis (Linter)
        run: |
          uv run flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: 5. Execute Tests & Quality Gate
        run: |
          uv run coverage run \
            --source=yummy_app,gps_service \
            -m unittest discover -s . -p "test_*.py" -v

          uv run coverage report -m

          uv run coverage html -d coverage_html

          uv run coverage report --fail-under=80

      - name: 6. Upload HTML Coverage Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YummyApp-Coverage-Report
          path: coverage_html/
          retention-days: 7
          if-no-files-found: warn
